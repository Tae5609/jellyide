<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="JellyIDE — download, clean, organize and manage your music library">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b2e"/>
      <stop offset="0.55" stop-color="#0f0a1a"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8b4fe"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8a2be2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8a2be2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="220" rx="24" fill="url(#bg)"/>
  <rect width="900" height="220" rx="24" fill="url(#glow)"/>
  <!-- equalizer bars -->
  <g fill="#8a2be2" opacity="0.18">
    <rect x="640" y="120" width="14" height="60" rx="4"/>
    <rect x="664" y="90" width="14" height="90" rx="4"/>
    <rect x="688" y="60" width="14" height="120" rx="4"/>
    <rect x="712" y="100" width="14" height="80" rx="4"/>
    <rect x="736" y="70" width="14" height="110" rx="4"/>
    <rect x="760" y="110" width="14" height="70" rx="4"/>
    <rect x="784" y="85" width="14" height="95" rx="4"/>
    <rect x="808" y="125" width="14" height="55" rx="4"/>
  </g>
  <!-- logo mark: play triangle with a music note (matches frontend/public/logo.png) -->
  <g transform="translate(60 40)">
    <path d="M14 0 C6 0 2 4 2 10 L2 130 C2 138 10 143 17 139 L128 76 C134 72 134 64 128 60 L17 1 C16 0 15 0 14 0 Z" fill="url(#mark)"/>
    <path d="M56 38 L56 86 A14 14 0 1 1 49 74 L49 34 L78 41 L78 52 L56 47 Z" fill="#ffffff"/>
  </g>
  <text x="225" y="112" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="url(#word)" letter-spacing="-1">JellyIDE</text>
  <text x="228" y="150" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#c4b5fd">Download · Clean · Organize · Manage your music library</text>
</svg>
